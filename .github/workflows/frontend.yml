name: Frontend

on:
  pull_request:
    branches: [review, main]
    paths:
      - 'life-frontend/**'
      - '.github/workflows/frontend.yml'
  push:
    branches: [review, main, 'release/**']
    paths:
      - 'life-frontend/**'
      - '.github/workflows/frontend.yml'

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: life-frontend

jobs:
  build:
    name: Compilar frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # La versión de Node sale de .nvmrc, la misma que usa el desarrollador
      - uses: actions/setup-node@v4
        with:
          node-version-file: life-frontend/.nvmrc
          cache: npm
          cache-dependency-path: life-frontend/package-lock.json

      - run: npm ci

      - run: npm run typecheck

  validate:
    name: Validar código del frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: life-frontend/.nvmrc
          cache: npm
          cache-dependency-path: life-frontend/package-lock.json

      - run: npm ci

      # Cada validación es un paso aparte para ver cuál falló
      - name: Tipado (typecheck)
        run: npm run typecheck

      - name: Lint (mobile, web, desktop y paquetes)
        run: npm run lint

      - name: Formato (Prettier)
        run: npm run format:check

  unit-tests:
    name: Pruebas unitarias del frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: life-frontend/.nvmrc
          cache: npm
          cache-dependency-path: life-frontend/package-lock.json

      - run: npm ci

      # Jest corre los proyectos de mobile, web, desktop y paquetes (ver jest.config.js)
      - name: Pruebas (Jest)
        run: |
          mkdir -p test-results
          npm test -- --ci --json --outputFile=test-results/jest.json

      - name: Resumen de resultados
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Pruebas unitarias del frontend"
            echo
            if [ -f test-results/jest.json ]; then
              echo "| Suites | Pruebas | Pasaron | Fallaron | Omitidas |"
              echo "|---|---|---|---|---|"
              jq -r '"| \(.numTotalTestSuites) | \(.numTotalTests) | \(.numPassedTests) | \(.numFailedTests) | \(.numPendingTests) |"' test-results/jest.json
              echo
              jq -r '.testResults[] | select(.status == "failed") | "- Falló `\(.name)`"' test-results/jest.json
            else
              echo "Sin resultados: Jest falló antes de probar."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar resultados
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: resultados-unitarias-frontend
          path: life-frontend/test-results
          if-no-files-found: ignore
