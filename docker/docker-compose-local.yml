name: life-local

services:
  postgres:
    image: postgres:17
    container_name: life-postgres
    environment:
      POSTGRES_DB: ModulLifeDev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ModulLifeDev"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrations:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
      target: migrations
    container_name: life-migrations
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=ModulLifeDev;Username=postgres;Password=${POSTGRES_PASSWORD}
      Authentication__AccessToken__SigningKey: ${ACCESS_TOKEN_SIGNING_KEY:?Set ACCESS_TOKEN_SIGNING_KEY in .env (see .env.example)}
      Email__Provider: Log
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
      target: runtime
    container_name: life-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=ModulLifeDev;Username=postgres;Password=${POSTGRES_PASSWORD}
      Authentication__AccessToken__SigningKey: ${ACCESS_TOKEN_SIGNING_KEY:?Set ACCESS_TOKEN_SIGNING_KEY in .env (see .env.example)}
      Email__Provider: Log
    ports:
      - "5187:5187"
    depends_on:
      migrations:
        condition: service_completed_successfully

  mobile:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
      target: mobile-dev
    container_name: life-mobile
    environment:
      REACT_NATIVE_PACKAGER_HOSTNAME: ${HOST_IP:-localhost}
      EXPO_PUBLIC_API_URL: http://${HOST_IP:-localhost}:5187
    ports:
      - "8081:8081"
    depends_on:
      - api

  web:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
      target: web-dev
    container_name: life-web
    ports:
      - "5173:5173"
    depends_on:
      - api

  desktop:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
      target: desktop-check
    container_name: life-desktop
    restart: "no"

  tests-backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
      target: test
    container_name: life-tests-backend
    restart: "no"

  tests-frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
      target: test
    container_name: life-tests-frontend
    restart: "no"

volumes:
  postgres-data:
